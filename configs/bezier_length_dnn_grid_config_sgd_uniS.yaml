program: bezier_length_dnn_grid.py
name: length_large_training_sgd_uniS
method: grid
metric:
  goal: minimize
  name: bezier_length
parameters:
  curve_params:
    parameters:
      k: 
        values: [2,5,10,20,40]
      model_kwargs:
        parameters:
          depth:
            value: 10
          width:
            value: 10
          activation:
            value: "elu"
      uniform_t_optimize:
        value: True
      n_samples:
        value: 500
      lr:
        value: 0.005
      num_epochs:
        value: 1_500_000
      weight_decay:
        values: [0., 0.01, 0.001]
      optim:
        value: "adam"
  rng_seed:
    values: [0, 1, 2, 3, 4, 5]